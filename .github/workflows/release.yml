name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches source
        shell: python
        run: |
          import os,re,pathlib
          version=re.search(r'<Version>([^<]+)</Version>',pathlib.Path('Directory.Build.props').read_text())[1]
          updater=pathlib.Path('src/LouisaWiFi.Windows/UpdateService.cs').read_text()
          assert f'CurrentVersion = "{version}"' in updater
          assert os.environ['GITHUB_REF'] == f'refs/tags/v{version}', 'Run release on a matching version tag'
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: artifacts
      - name: Publish validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Louisa Wi-Fi for Windows $GITHUB_REF_NAME" --notes-file .github/release-notes.md "${args[@]}"
